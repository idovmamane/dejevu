name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: node --check dejevu/snapshot.js

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: uv sync
      - run: uv run python scripts/check_browser.py
        env:
          DEJEVU_CHROME: ${{ steps.chrome.outputs.chrome-path }}
